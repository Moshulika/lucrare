[project]
name = "vibe-cli"
version = "0.1.0"
description = "Multi-provider LLM agent for the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Moshulika", email = "enanescu@adobe.com" },
]
classifiers = [
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph",
    "textual",
    "pyyaml",
    "ruamel.yaml>=0.18",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-aws",
    "langchain-google-genai",
    "prompt-toolkit",
    "rich",
    "duckduckgo-search",
    "langchain-ollama>=1.1.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "uuid-utils>=0.10",
    # Multimodal: PDF parsing for the /attach + read_pdf_pages flow. Pure-
    # Python, lightweight (~1 MB) — pulling into base deps so dragging a PDF
    # into the prompt just works without an opt-in install.
    "pypdf>=4.0",
]

[project.optional-dependencies]
# LangFuse is the only supported tracing backend. SDK v3+ targets LangFuse
# Cloud (or your own v3+ instance) and matches our langchain 1.x stack.
# The umbrella `langchain` package is required for the SDK to enable its
# LangChain callback module — `langchain-core` alone isn't enough.
tracing = ["langfuse>=3", "langchain>=1"]
web = ["flask>=3.0", "psutil>=5.9"]
eval = ["sacrebleu>=2.4", "rouge-score>=0.1.2", "scikit-learn>=1.3"]
# Multimodal: only PyMuPDF (heavier, C-based ~10 MB) is opt-in. It's used
# for the rare `read_pdf_pages(..., as_image=True)` path — rendering a PDF
# page to PNG for figure-heavy spreads on vision-capable models. Everyday
# text extraction works without this extra (pypdf ships in base deps).
multimodal = ["pymupdf>=1.24"]

[project.scripts]
vibe = "ui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "ui", "web", "eval"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.yml" = "config/config.yml"
"config/eval.yml" = "config/eval.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
