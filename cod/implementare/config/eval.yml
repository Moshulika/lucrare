# ---------------------------------------------------------------------------
# Eval configuration
# ---------------------------------------------------------------------------
# Loaded by `vibe eval` and `python -m eval`.
# All fields are optional; CLI flags override anything here.

eval:
  # Maximum parallel headless sessions
  concurrency: 2

  # Per-case timeout in seconds. 1200s so the hardest cases in the
  # bundled agentic_bench (Task 5 — greenfield feature build; Task 6 —
  # cross-system threshold stage) actually have time to complete even
  # on the slowest models. Local providers in --all mode also use this
  # as a floor (eval/__main__.py:_apply_provider_defaults). Per-case
  # `timeout:` in the dataset overrides this.
  timeout_seconds: 1200

  # Provider/model for all eval cases (null = use the default from preferences.json).
  # Per-case overrides in the dataset file take priority over these.
  provider: null
  model: null

  # When true, `vibe eval` defaults to sweep mode: discovers every
  # provider in config.yml with a valid key, runs the suite across every
  # model listed under each, and auto-merges into leaderboard.csv /
  # all_cases.csv. Pass `--no-all` on the CLI for a one-off single-model
  # run without editing this file. CLI `--all` also works (and overrides
  # this when this is false).
  all_models: true

  # Where to write JSON reports. Supports ~ and ${ENV_VAR}.
  # Reports are written as eval/results/eval_<timestamp>.json relative to the
  # project root by default. Use an absolute path or ~ to redirect elsewhere.
  output_dir: eval/results

  # Datasets to include by default (relative to the project root, or absolute).
  # Extra datasets can be appended via CLI positional args.
  # The bundled agentic_bench is the 5-task suite the rest of the repo
  # (hidden tests, judge rubrics, leaderboard rendering) is wired around.
  datasets:
    - eval/examples/agentic_bench.yaml
    # - eval/examples/basic_qa.yaml
    # - eval/examples/tool_use.yaml

  # -------------------------------------------------------------------
  # Metric configuration
  # Each metric can be disabled with `enabled: false`.
  # -------------------------------------------------------------------
  metrics:
    bleu:
      enabled: true

    rouge:
      enabled: true
      # Variants to compute (rouge1, rouge2, rougeL are the standard set)
      variants: [rouge1, rouge2, rougeL]

    semantic_similarity:
      # Uses TF-IDF cosine similarity (scikit-learn) when available,
      # falls back to Jaccard token overlap otherwise.
      enabled: true

    exact_match:
      enabled: true

    partial_match:
      enabled: true
      # Token-overlap ratio threshold to count as a partial match
      threshold: 0.5

    tool_match:
      # Compares actual tool names called vs expected_tools in the dataset.
      # Scores precision / recall / F1 over tool name sets.
      enabled: true

    subagent_match:
      # Compares actual subagent_type names spawned vs expected_subagents
      # in the dataset (sourced from `spawn_subagent` calls). Same shape as
      # tool_match (precision / recall / F1).
      enabled: true

    tool_output_similarity:
      # Semantic similarity between the concatenated text of all non-subagent
      # tool results and `expected_tool_output` on the case. Useful when the
      # answer you want to grade is what a tool *returned*, not what the
      # model said in its final reply. Disabled by default — set
      # `expected_tool_output` on a case and flip this on to use.
      enabled: false

    subagent_output_similarity:
      # Same as tool_output_similarity but for `spawn_subagent` final reports.
      # Reads `expected_subagent_output` from the case.
      enabled: false